name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Runtime dependencies must be clean; dev-only findings are reported but never fail the build.
      - name: Audit dependencies (runtime)
        run: bun audit --prod
      - name: Audit dependencies (dev tools, report only)
        run: bun audit
        continue-on-error: true
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
      - name: Browser tests (desktop, tablet, mobile)
        run: bun run test:e2e
